server:
  port: 8085

spring:
  application:
    name: file-service

  datasource:
    # Uses same Neon DB as other services — tables are isolated by name
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-polished-fog-amshlcjk-pooler.c-5.us-east-1.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_3WGAnNgYMzw0}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# MinIO — runs locally in Docker
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  presigned-url-expiry: 15

# Bucket names
buckets:
  resumes: resumes
  project-docs: project-docs
  progress-attachments: progress-attachments
  portfolios: portfolios

services:
  contract: ${CONTRACT_SERVICE_URL:http://contract-service}
  notification: ${NOTIFICATION_SERVICE_URL:http://notification-service}
  profile: ${PROFILE_SERVICE_URL:http://profile-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.freelancer.file: DEBUG