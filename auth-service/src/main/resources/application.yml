server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # Replace with your own DB credentials or use env vars in production
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freelancerdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # BUG FIX #5 — LOAD BALANCER CACHE MUST BE CAFFEINE, NOT DEFAULT
  # Without this, Spring Cloud LoadBalancer uses a reactive caffeine cache.
  # If caffeine is not on the classpath, it falls back to a broken default
  # that causes NoClassDefFoundError on the first service-to-service call.
  cloud:
    loadbalancer:
      cache:
        enabled: true

# BUG FIX #6 — EUREKA YAML INDENTATION
#
# Original file had 1-space indentation on the eureka block:
#  eureka:         <- 1 space — silently ignored by the YAML parser
#   client:        <- Spring Boot never reads this
#
# YAML requires consistent 2-space indentation. With wrong indentation,
# the entire eureka section is parsed as a continuation of the previous
# block (spring:) or ignored, and auth-service never registers with
# Eureka. The API Gateway (using lb://auth-service) then gets:
#   "503 Service Unavailable — No instances available for auth-service"
# which surfaces as a 503 or connection refused to the React frontend.
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: ${JWT_SECRET:freelancer_platform_super_secret_key_256bits_change_in_prod}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Service URLs — use Eureka names for inter-service calls
services:
  profile: ${PROFILE_SERVICE_URL:http://profile-service}
  notification: ${NOTIFICATION_SERVICE_URL:http://notification-service}

logging:
  level:
    com.freelancer.auth: DEBUG
    org.springframework.security: INFO