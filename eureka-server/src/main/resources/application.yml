server:
  port: 8761

spring:
  application:
    name: eureka-server
  # Disable security for Eureka dashboard
  security:
    user:
      password: none

eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server does not register itself
    register-with-eureka: false
    fetch-registry: false
    
  server:
    # Don't wait for other servers on startup
    wait-time-in-ms-when-sync-empty: 0
    # Don't protect registry from eviction during dev
    enable-self-preservation: false
    # Remove unresponsive services quickly during dev
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info