server:
  port: 8090

spring:
  application:
    name: message-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-polished-fog-amshlcjk-pooler.c-5.us-east-1.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_3WGAnNgYMzw0}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# BUG FIX — jwt.secret WAS MISSING FROM THIS FILE
#
# WebSocketConfig now validates the JWT token at handshake time.
# It injects ${jwt.secret} via @Value. Without this entry,
# Spring throws:
#   IllegalArgumentException: Could not resolve placeholder 'jwt.secret'
# and message-service fails to start.
#
# Must use the SAME secret as api-gateway and auth-service so tokens
# issued by auth-service can be verified here.
jwt:
  secret: ${JWT_SECRET:freelancer_platform_super_secret_key_256bits_change_in_prod}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.freelancer.message: DEBUG