server:
  port: 8090

spring:
  application:
    name: message-service

  datasource:
    # Paste your Supabase connection string here
    url: ${RENDER_DB_URL:postgresql://messageservice_user:5ByWqlF6kxQ0Ws9pRbW6VBQk80wEGlQS@dpg-d7115ijuibrs739la8f0-a.singapore-postgres.render.com/messageservice}
    username: ${RENDER_DB_USER:messageservice_user}
    password: ${RENDER_DB_PASSWORD:5ByWqlF6kxQ0Ws9pRbW6VBQk80wEGlQS}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep pool small — Supabase free = 20 max connections
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.freelancer.message: DEBUG