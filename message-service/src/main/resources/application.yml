server:
  port: 8090

spring:
  application:
    name: message-service

  datasource:
    url: jdbc:postgresql://dpg-d7115ijuibrs739la8f0-a.singapore-postgres.render.com:5432/messageservice
    username: messageservice_user
    password: 5ByWqlF6kxQ0Ws9pRbW6VBQk80wEGlQS
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.freelancer.message: DEBUG