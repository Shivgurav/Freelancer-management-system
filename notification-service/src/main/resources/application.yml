server:
  port: 8087

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-polished-fog-amshlcjk-pooler.c-5.us-east-1.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_3WGAnNgYMzw0}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Email configuration — reads from environment variables
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:talentflow69@gmail.com}
    password: ${MAIL_PASSWORD:ojitoyrrwlxalndv}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # Thymeleaf templates for HTML emails
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Platform name shown in emails
app:
  name: FreelanceHub
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  support-email: ${SUPPORT_EMAIL:support@freelancehub.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.freelancer.notification: DEBUG
    org.springframework.mail: DEBUG