server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Global CORS handled by CorsConfig.java bean
      globalcors:
        add-to-simple-url-handler-mapping: true
      routes:

        # ── Auth Service ──────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthFilter

        # ── Profile Service ───────────────────────────────────────
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**
          filters:
            - JwtAuthFilter

