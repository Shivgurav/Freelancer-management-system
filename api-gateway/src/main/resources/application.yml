server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global CORS — handled by CorsFilter.java
      globalcors:
        add-to-simple-url-handler-mapping: true

      # Default filters applied to ALL routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:

        # ── Auth Service ────────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ── Profile Service ─────────────────────────────────────────
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**
          filters:
            - JwtAuthFilter

        # ── Job Service ─────────────────────────────────────────────
        - id: job-service-jobs
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/**
          filters:
            - JwtAuthFilter

        - id: job-service-bids
          uri: lb://job-service
          predicates:
            - Path=/api/bids/**
          filters:
            - JwtAuthFilter

        # ── Contract Service ────────────────────────────────────────
        - id: contract-service-contracts
          uri: lb://contract-service
          predicates:
            - Path=/api/contracts/**
          filters:
            - JwtAuthFilter

        - id: contract-service-milestones
          uri: lb://contract-service
          predicates:
            - Path=/api/milestones/**
          filters:
            - JwtAuthFilter

        - id: contract-service-reports
          uri: lb://contract-service
          predicates:
            - Path=/api/reports/**
          filters:
            - JwtAuthFilter

        # ── File Service ────────────────────────────────────────────
#        - id: file-service
#          uri: lb://file-service
#          predicates:
#            - Path=/api/files/**
#          filters:
#            - JwtAuthFilter

        # ── Review Service ──────────────────────────────────────────
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**
          filters:
            - JwtAuthFilter

        # ── Notification Service ────────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthFilter

        # ── Search Service ──────────────────────────────────────────
#        - id: search-service
#          uri: lb://search-service
#          predicates:
#            - Path=/api/search/**
#          filters:
#            - JwtAuthFilter

        # ── Analytics Service ───────────────────────────────────────
#        - id: analytics-service
#          uri: lb://analytics-service
#          predicates:
#            - Path=/api/analytics/**
#          filters:
#            - JwtAuthFilter

# Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT
jwt:
  secret: ${JWT_SECRET:freelancer_platform_super_secret_key_256bits_change_in_prod}

# CORS
app:
  env: ${APP_ENV:dev}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.freelancer.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.filter: DEBUG