# Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT secret — must match auth-service exactly
jwt:
  secret: ${JWT_SECRET:freelancer_platform_super_secret_key_256bits_change_in_prod}

# CORS allowed origins — comma separated
cors:
 allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://192.168.1.5:3000,http://192.168.1.5:5173}
 
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.freelancer.gateway: DEBUG
    org.springframework.cloud.gateway: INFO