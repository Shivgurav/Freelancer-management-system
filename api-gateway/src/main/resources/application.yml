server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:

        # ── Auth Service ──────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthFilter

        # ── Profile Service ───────────────────────────────────────
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**
          filters:
            - JwtAuthFilter

        # ── Job Service ───────────────────────────────────────────
        - id: job-service-jobs
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/**
          filters:
            - JwtAuthFilter

        - id: job-service-bids
          uri: lb://job-service
          predicates:
            - Path=/api/bids/**
          filters:
            - JwtAuthFilter

        # ── Contract Service ──────────────────────────────────────
        - id: contract-service-contracts
          uri: lb://contract-service
          predicates:
            - Path=/api/contracts/**
          filters:
            - JwtAuthFilter

        - id: contract-service-milestones
          uri: lb://contract-service
          predicates:
            - Path=/api/milestones/**
          filters:
            - JwtAuthFilter

        - id: contract-service-reports
          uri: lb://contract-service
          predicates:
            - Path=/api/reports/**
          filters:
            - JwtAuthFilter

        # ── File Service ──────────────────────────────────────────
#        - id: file-service
#          uri: lb://file-service
#          predicates:
#            - Path=/api/files/**
#          filters:
#            - JwtAuthFilter

        # ── Review Service ────────────────────────────────────────
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**
          filters:
            - JwtAuthFilter

        # ── Notification Service ──────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthFilter

#         ── Search Service ────────────────────────────────────────
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
          filters:
            - JwtAuthFilter

        # ── Analytics Service ─────────────────────────────────────
#        - id: analytics-service
#          uri: lb://analytics-service
#          predicates:
#            - Path=/api/analytics/**
#          filters:
#            - JwtAuthFilter


       #-----routes for websocket of messaging system
        - id: message-service-websocket
          uri: lb:ws://message-service
          predicates:
            - Path=/ws/**
       #----routes for rest messaging
        - id: message-service-rest
          uri: lb://message-service
          predicates:
            - Path=/api/messages/**
          filters:
            - JwtAuthFilter

     
# ── Eureka ─────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    # How often to fetch registry from Eureka
    registry-fetch-interval-seconds: 5
    # If Eureka is down — do not crash, keep retrying
    enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    # How long before Eureka removes this instance if no heartbeat
    lease-expiration-duration-in-seconds: 30
    # How often to send heartbeat to Eureka
    lease-renewal-interval-in-seconds: 10

# ── JWT ────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:freelancer_platform_super_secret_key_256bits_change_in_prod}

# ── CORS ───────────────────────────────────────────────────────────
app:
  env: ${APP_ENV:dev}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Actuator ───────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    com.freelancer.gateway: DEBUG
    org.springframework.cloud.gateway: INFO